name: Update Profile Art & Heatmap

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  GH_PROFILE_USER: Divyanshu-Jaiswal-17

jobs:
  update-art:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch contribution data & render SVGs
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
          python scripts/make_info_card.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/contributions.json contrib-heatmap.svg info-card.svg
          if git diff --staged --quiet; then
            echo "No changes in generated profile art or contributions."
          else
            git commit -m "chore(auto): update profile contributions heatmap and info card"
            git push
          fi
