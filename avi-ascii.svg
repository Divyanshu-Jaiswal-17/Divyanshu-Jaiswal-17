<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 622" width="530" height="622">
<defs>
  <style>
    @keyframes lineFadeIn {
      0% { opacity: 0; transform: translateY(2px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes cursorBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .terminal-bg { fill: #0d1117; stroke: #30363d; stroke-width: 1.5; rx: 10px; ry: 10px; }
    .terminal-header { fill: #161b22; rx: 10px; ry: 10px; }
    .btn-red { fill: #ff5f56; }
    .btn-yellow { fill: #ffbd2e; }
    .btn-green { fill: #27c93f; }
    .cmd-text { font-family: "Fira Code", "Courier New", Consolas, monospace; font-size: 11px; fill: #58a6ff; font-weight: 600; }
    .user-text { font-family: "Fira Code", "Courier New", Consolas, monospace; font-size: 11px; fill: #3fb950; font-weight: bold; }
    .ascii-line { font-family: "Fira Code", "Courier New", Consolas, monospace; font-size: 7.5px; fill: #c9d1d9; opacity: 0; animation: lineFadeIn 0.1s ease-out forwards; white-space: pre; }
    .cursor { fill: #58a6ff; animation: cursorBlink 1s infinite; }
  </style>
</defs>
<rect width="530" height="622" class="terminal-bg" />
